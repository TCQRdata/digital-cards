<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fernando Benjumea Hernández — Transconsult</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#e8edf5;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0}
.wrap{max-width:420px;width:100%;background:#fff;min-height:100vh;position:relative;overflow:hidden}
#splash{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 0.7s ease;max-width:420px;margin:0 auto;left:50%;transform:translateX(-50%);width:100%}
#splash.hidden{opacity:0;pointer-events:none}
.splash-logo{width:70%;max-width:240px;animation:zoomIn 0.9s ease}
.splash-tagline{margin-top:16px;font-size:13px;color:#999;letter-spacing:0.6px}
.progress-bar{width:56px;height:3px;background:#eee;border-radius:2px;margin-top:24px;overflow:hidden}
.progress-fill{height:100%;background:#1a4fa0;border-radius:2px;animation:prog 2.4s ease forwards}
@keyframes zoomIn{from{opacity:0;transform:scale(0.88)}to{opacity:1;transform:scale(1)}}
@keyframes prog{from{width:0%}to{width:100%}}
#card{opacity:0;transition:opacity 0.7s ease}
#card.visible{opacity:1}
.header{background:linear-gradient(150deg,#0d3a8a 0%,#1a4fa0 45%,#2563c7 100%);padding:40px 24px 54px;text-align:center;position:relative}
.avatar{width:96px;height:96px;border-radius:50%;border:3px solid #fff;margin:0 auto 14px;background:#1a4fa0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:600;color:#fff;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.25)}
.avatar img{width:100%;height:100%;object-fit:cover;object-position:center;border-radius:50%}
.full-name{color:#fff;font-size:19px;font-weight:600;line-height:1.35;margin-bottom:5px}
.job-title{color:rgba(255,255,255,0.78);font-size:13px}
.wave{position:absolute;bottom:-1px;left:0;width:100%}
.actions{display:flex;justify-content:center;gap:18px;padding:0 24px;margin-top:-26px;position:relative;z-index:2}
.act-btn{width:52px;height:52px;border-radius:50%;background:#fff;border:none;box-shadow:0 3px 12px rgba(0,0,0,0.13);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;color:#1a4fa0;transition:transform 0.15s}
.act-btn:hover{transform:scale(1.08)}
.contact-list{padding:20px 20px 6px}
.c-row{display:flex;align-items:center;gap:13px;padding:13px 0;border-bottom:1px solid #f2f2f2}
.c-row:last-child{border-bottom:none}
.c-icon{width:38px;height:38px;border-radius:50%;background:#eef3fb;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#1a4fa0}
.c-label{font-size:11px;color:#999;margin-bottom:2px;text-transform:uppercase;letter-spacing:0.4px}
.c-val{font-size:14px;color:#1a1a1a;font-weight:500;word-break:break-all}
.links-sec{padding:4px 20px 14px}
.links-head{font-size:11px;color:#999;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px;padding-top:6px}
.l-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f2f2f2;text-decoration:none}
.l-row:last-child{border-bottom:none}
.l-left{display:flex;align-items:center;gap:10px;font-size:14px;color:#1a1a1a;font-weight:500}
.save-btn{margin:4px 20px 28px;background:#1a4fa0;color:#fff;border:none;border-radius:12px;padding:15px;width:calc(100% - 40px);font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:background 0.15s}
.save-btn:hover{background:#153d80}
</style>
</head>
